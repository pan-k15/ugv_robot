# controllers_v2.yaml
# ros2_control controller configuration for ugv_rover_pt (robot_v2)
#
# Controllers loaded:
#   joint_state_broadcaster  – publishes /joint_states (replaces gz joint-state plugin)
#   diff_drive_controller    – skid-steer drive via /cmd_vel, publishes /odom and /tf
#   pan_tilt_controller      – JointTrajectoryController for the pan/tilt head

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    pan_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ── Skid-steer drive ────────────────────────────────────────────────────────
# left_wheel_names / right_wheel_names accept multiple joints; the controller
# averages the per-side velocities to compute odometry, matching true skid-steer
# behaviour with front and rear axles driven together.
diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint

    # Geometry (must match URDF values)
    # wheel_separation = 2 × wheel_y_bl = 2 × (0.23042/2 − 0.052/2) = 0.17842 m
    wheel_separation: 0.17842
    wheel_radius: 0.04187

    # Odometry
    odom_frame_id: odom
    base_frame_id: base_footprint
    publish_rate: 30.0
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # cmd_vel input (Jazzy: controller only accepts TwistStamped on ~/cmd_vel)
    cmd_vel_timeout: 0.5

    # velocity / acceleration limits
    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            0.8   # m/s
    linear.x.min_velocity:           -0.8
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        1.0
    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.0  # rad/s
    angular.z.min_velocity:           -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        2.0

    # Publish wheel joint commands to /joint_states as well
    enable_odom_tf: true

# ── Pan / tilt head ──────────────────────────────────────────────────────────
pan_tilt_controller:
  ros__parameters:
    joints:
      - pan_joint
      - tilt_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
